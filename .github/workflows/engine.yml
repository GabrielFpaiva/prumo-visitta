name: engine

on:
  push:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv sync --extra colmap
      - run: uv run pytest -v

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco (a imagem CUDA passa de 10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: engine
          load: true
          tags: visitta-engine:ci
      - name: Smoke (sem GPU)
        run: |
          docker run --rm visitta-engine:ci --help
          docker run --rm --entrypoint bash visitta-engine:ci -c '
            set -e
            ffmpeg -version | head -1
            splat-transform --help | head -3
            /opt/engine/bin/python -c "import pycolmap; print(pycolmap.__version__)"
            /opt/train/bin/python -c "import gsplat, torch; print(gsplat.__version__, torch.__version__)"
            /opt/train/bin/python /opt/gsplat/examples/simple_trainer.py default --help | grep -E "save[-_]ply"
          '
      - name: Push
        run: |
          IMG=ghcr.io/gabrielfpaiva/visitta-engine
          docker tag visitta-engine:ci $IMG:${{ steps.tag.outputs.sha }}
          docker push $IMG:${{ steps.tag.outputs.sha }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then docker tag visitta-engine:ci $IMG:latest && docker push $IMG:latest; fi
