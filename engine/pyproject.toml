[project]
name = "visitta-engine"
version = "0.1.0"
description = "Motor do Prumo Visitta: vídeo/fotos → COLMAP → gsplat → splat"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "pillow-heif>=0.20",
]

[project.optional-dependencies]
# Local (CPU). Na imagem Docker entra `pycolmap-cuda12==4.2.1` no lugar.
colmap = ["pycolmap==4.2.1"]

[dependency-groups]
dev = ["pytest>=8.3"]
tools = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visitta_engine"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
